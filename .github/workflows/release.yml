name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: |
          platforms="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64"
          for platform in $platforms; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            name="bumpit_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              GOOS=$GOOS GOARCH=$GOARCH go build -o bumpit.exe .
              zip "${name}.zip" bumpit.exe
              rm bumpit.exe
            else
              GOOS=$GOOS GOARCH=$GOARCH go build -o bumpit .
              tar -czf "${name}.tar.gz" bumpit
              rm bumpit
            fi
          done

      - name: Checksums
        run: sha256sum *.tar.gz *.zip > checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            checksums.sha256
          generate_release_notes: true
